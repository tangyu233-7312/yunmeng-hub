<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<!-- ★ script-src 里的 'self' 是必需的：本页要加载同目录的 setup-validate.js。
     少了它，那个 <script src> 会被 CSP **静默拦掉**（只有控制台报错，
     页面上表现为"填错了也不提示"）—— 这个坑我实测踩到过一次。 -->
<title>云梦枢 · 首次设置</title>
<style>
  :root {
    --bg: #0a0d17;
    --surface: rgba(255, 255, 255, .045);
    --border: rgba(167, 139, 250, .22);
    --text: #e6eaf0;
    --text-dim: #a3adbb;
    --brand: #a78bfa;
    --aurora: #00e5ff;
    --danger: #ff9a9a;
    --ok: #7ee2b8;
    --warn: #ffd88a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13.5px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1100px 640px at 10% -12%, rgba(167,139,250,.15), transparent 70%),
      radial-gradient(900px 600px at 106% 112%, rgba(0,229,255,.11), transparent 70%);
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 22px; }
  .card {
    width: min(880px, 100%); max-height: 100%; overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 26px 30px; backdrop-filter: blur(14px);
    box-shadow: 0 0 42px rgba(167,139,250,.12);
  }
  .head { display: flex; align-items: center; gap: 13px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; filter: drop-shadow(0 0 10px rgba(167,139,250,.45)); }
  h1 { margin: 0; font-size: 19px; letter-spacing: .06em; }
  .sub { color: var(--text-dim); font-size: 12px; letter-spacing: .14em; margin-top: 2px; }
  .lead { margin: 18px 0 6px; color: var(--text-dim); font-size: 12.5px; }
  .lead b { color: var(--text); font-weight: 600; }

  fieldset { border: 0; padding: 0; margin: 18px 0 0; }
  legend { color: var(--aurora); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 0 0 8px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .field.wide { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; font: inherit; font-size: 13px; color: var(--text);
    background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.10);
    border-radius: 8px; padding: 7px 10px;
  }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(167,139,250,.16); }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .hint { color: var(--text-dim); font-size: 11.5px; margin-top: 3px; }
  .err { color: var(--danger); font-size: 11.5px; margin-top: 3px; min-height: 15px; }

  button {
    font: inherit; font-size: 12.5px; color: var(--text);
    background: rgba(167,139,250,.16); border: 1px solid rgba(167,139,250,.38);
    border-radius: 9px; padding: 7px 14px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: rgba(167,139,250,.26); border-color: var(--brand); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; border-color: rgba(255,255,255,.16); }
  button.ghost:hover { border-color: var(--aurora); background: rgba(0,229,255,.10); }
  button.primary { background: rgba(167,139,250,.28); border-color: var(--brand); font-weight: 600; }
  button.mini { padding: 6px 10px; font-size: 11.5px; }
  /* 「小眼睛」：方一些，图标居中，别被挤压变形 */
  button.eye {
    padding: 6px 9px; min-width: 34px; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button.eye[aria-pressed="true"] { border-color: var(--aurora); color: var(--aurora); }

  .actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }

  .status {
    margin-top: 14px; padding: 11px 13px; border-radius: 9px; font-size: 12.5px;
    border: 1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.24);
    white-space: pre-wrap; word-break: break-word; display: none;
  }
  .status.show { display: block; }
  .status.ok { border-color: rgba(126,226,184,.45); color: var(--ok); }
  .status.err { border-color: rgba(255,154,154,.45); color: var(--danger); }
  .status.busy { border-color: rgba(0,229,255,.35); color: var(--aurora); }
  /* ★ 详细输出默认折叠：那段 Traceback / 自检日志对填表的人是干扰，
     但对排查的人有用 —— 所以"收起来"而不是"删掉"。 */
  .status .detail-toggle {
    display: inline-block; margin-top: 8px; padding: 3px 9px; font-size: 11.5px;
    background: transparent; border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px; color: var(--text-dim); cursor: pointer;
  }
  .status .detail-toggle:hover { border-color: var(--aurora); color: var(--aurora); }
  .status pre {
    margin: 8px 0 0; font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 11px; color: var(--text-dim); white-space: pre-wrap;
    max-height: 240px; overflow: auto;
    border-left: 2px solid rgba(255,255,255,.14); padding-left: 9px;
  }
  .status pre[hidden] { display: none; }

  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 12px; }
  details .grid { margin-top: 10px; }
  .foot { margin-top: 16px; color: var(--text-dim); font-size: 11.5px; }
  code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
    background: rgba(0,0,0,.28); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <img class="logo" id="logo" src="../../web/img/logo-256.png" alt="云梦枢">
      <div>
        <h1>首次设置</h1>
        <div class="sub">YUNMENG HUB · 交互式叙事引擎</div>
      </div>
    </div>

    <p class="lead">
      云梦枢需要一个 <b>MySQL 数据库</b>来存角色卡、会话与消息（向量记忆存在本地目录，不用你管）。
      这里填的配置会写进 <b>应用数据目录</b>（不在安装目录里），<b>卸载重装不会丢</b>。
    </p>
    <p class="lead" id="existing-note" style="display:none"></p>

    <form id="form" autocomplete="off">
      <fieldset>
        <legend>MySQL 连接</legend>
        <div class="grid" id="mysql-grid"></div>
      </fieldset>

      <fieldset>
        <legend>安全密钥</legend>
        <div class="grid" id="secret-grid"></div>
      </fieldset>

      <details>
        <summary>高级选项（一般不用改）</summary>
        <div class="grid" id="advanced-grid"></div>
      </details>

      <div class="actions">
        <button type="button" class="ghost" id="btn-test">测试连接</button>
        <button type="submit" class="primary" id="btn-save">保存并开始</button>
        <span class="spacer"></span>
        <button type="button" class="ghost mini" id="btn-open-dir">打开配置所在目录</button>
      </div>
    </form>

    <div class="status" id="status"></div>

    <div class="foot">
      测试连接会用<b>真正的后端</b>起一次服务并逐项检查数据库与向量库 ——
      所以它通过就意味着"能用了"，而不是"格式看起来对"。
      必填项没填时会<b>当场</b>告诉你，不会去起后端。
    </div>
  </div>
</div>

<!-- 发请求前的本地体检（纯函数，有单测；与 setup-config.js 的必填判据一致） -->
<script src="setup-validate.js"></script>
<script>
  'use strict';

  const api = window.yunmengSetup;
  const inputs = {};
  /** 字段定义（boot 时从主进程取；本地体检要用它判断哪些是必填） */
  let fieldDefs = [];
  const el = {
    form: document.getElementById('form'),
    mysqlGrid: document.getElementById('mysql-grid'),
    secretGrid: document.getElementById('secret-grid'),
    advancedGrid: document.getElementById('advanced-grid'),
    status: document.getElementById('status'),
    test: document.getElementById('btn-test'),
    save: document.getElementById('btn-save'),
    openDir: document.getElementById('btn-open-dir'),
    existingNote: document.getElementById('existing-note'),
    logo: document.getElementById('logo'),
  };

  if (!api) {
    setStatus('err', '这个页面需要在云梦枢桌面版里打开（缺少预加载脚本）。');
    el.form.style.display = 'none';
  }

  /**
   * 显示状态。
   *
   * ★ 改过一次：原来把 detail（后端自检的整段输出，含 Traceback）**直接拼在正文里**。
   *   用户填错一个口令就会看到十几行日志 —— 而真正有用的那句"口令不对"被淹了。
   *   现在：正文只放结论，细节收进「查看详情」按钮后面（默认折叠，点开才有）。
   *   信息一点没少，但不再抢注意力。
   */
  function setStatus(kind, text, detail) {
    el.status.className = 'status show ' + (kind || '');
    el.status.textContent = '';
    el.status.appendChild(document.createTextNode(text || ''));
    if (detail && String(detail).trim()) {
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'detail-toggle';
      toggle.textContent = '查看详情';
      const pre = document.createElement('pre');
      pre.textContent = String(detail);
      pre.hidden = true;
      toggle.addEventListener('click', () => {
        pre.hidden = !pre.hidden;
        toggle.textContent = pre.hidden ? '查看详情' : '收起详情';
      });
      el.status.appendChild(document.createElement('br'));
      el.status.appendChild(toggle);
      el.status.appendChild(pre);
    }
  }

  function clearStatus() { el.status.className = 'status'; el.status.textContent = ''; }

  /**
   * 让一个密码框**显示**或**隐藏**（并同步眼睛按钮的状态）。
   *
   * ★ 参数按**用户视角**取义：`visible === true` = 让用户看见明文。
   *   第一版参数叫 `masked`（true = 隐藏），而调用方脑子里想的是"显示"，
   *   于是两处调用各错一次、表现都是"点了没反应"，排查了四轮才定位到语义反了。
   *   ★ 教训：**布尔参数的名字要念得出来**（`setVisible(key, true)` 不会歧义；
   *   `setMasked(key, false)` 每次都得在脑子里翻一层）。这种"翻一层"就是 bug 的温床。
   *
   *   默认仍然是**隐藏**（一打开页面就把秘密摊在屏幕上不合适，旁边站个人就看到了）。
   *
   * ★ 实现上刻意**按 id 现查 DOM**，而不是用之前保存的对象引用：
   *   输入框的 id 唯一且稳定，`getElementById` 拿到的**必然**是页面上那一个；
   *   图标也从 DOM 里取。于是这个函数不依赖任何闭包状态，改不动是不可能的。
   */
  function setVisible(key, visible) {
    const input = document.getElementById('f-' + key);
    if (!input) return;
    input.type = visible ? 'text' : 'password';
    const row = input.closest('.row');
    const eye = row ? row.querySelector('button.eye') : null;
    if (eye) {
      // 👁 = "点我就能看见"（当前隐藏）；🙈 = "点我就藏起来"（当前已显示）
      eye.textContent = visible ? '🙈' : '👁';
      eye.title = visible ? '隐藏这一格的内容' : '显示这一格的内容';
      eye.setAttribute('aria-label', visible ? '隐藏这一格的内容' : '显示这一格的内容');
      eye.setAttribute('aria-pressed', visible ? 'true' : 'false');
    }
  }

  /**
   * 复制文本到剪贴板。
   *
   * ★ 为什么不用 `eval` 之类的技巧：这个页面的 CSP **没有** `unsafe-eval`，
   *   任何 `eval`/`new Function` 都会被拦掉。而密钥里可能出现空格、引号、`#`、换行
   *   （真值来自 base64url / Fernet，字符集本来就很杂），手拼 JS 字符串很容易拼坏。
   *   所以就用最朴素的 `navigator.clipboard.writeText`，失败再退到
   *   `document.execCommand('copy')` —— 两条路都不需要 eval。
   */
  async function copyText(value, button) {
    const text = String(value == null ? '' : value);
    if (!text) {
      setStatus('err', '这一格还是空的，先生成或填上再复制。');
      return;
    }
    const original = button ? button.textContent : '';
    const flash = (label) => {
      if (!button) return;
      button.textContent = label;
      setTimeout(() => { button.textContent = original; }, 1200);
    };
    try {
      await navigator.clipboard.writeText(text);
      flash('已复制');
      return;
    } catch (error) {
      // 剪贴板 API 在某些环境下会被拒（没有焦点、权限策略等）——退到老办法
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        flash('已复制');
      } catch (fallbackError) {
        setStatus('err', '复制失败，请点「👁」显示后手动选中复制。', String(fallbackError && fallbackError.message));
      }
    }
  }

  /**
   * 发请求前的本地体检。返回 true = 可以发给主进程。
   *
   * ★ 为什么加这一层：用户把 MySQL 口令留空就点了保存 → 应用起了一次真后端 →
   *   后端报 1045 + Traceback。那段输出对排查有用，但对填表的人是纯干扰：
   *   真正的原因就是"那一格没填"。所以**能在本地一眼看出来的，就不许去起后端**；
   *   本地看不出来的（口令对不对、库存不存在）仍旧交给真后端 —— 这层不越界。
   */
  function gateLocal() {
    const check = window.HneSetupValidate.precheck({ fields: fieldDefs, values: collect() });
    showErrors(check.errors || {});
    if (!check.ok) {
      setStatus('err', check.message);
      // 把焦点送到第一个出错的格子，省得用户自己找
      const firstKey = Object.keys(check.errors || {})[0];
      if (firstKey && inputs[firstKey]) {
        inputs[firstKey].input.focus();
        inputs[firstKey].input.scrollIntoView({ block: 'center' });
      }
      return false;
    }
    return true;
  }

  function buildField(field, container) {
    const wrap = document.createElement('div');
    wrap.className = 'field' + (field.key === 'HNE_SECRET_KEY' || field.key === 'HNE_API_KEY_ENCRYPTION_KEY' ? ' wide' : '');

    const label = document.createElement('label');
    label.textContent = field.label + (field.required ? ' *' : '');
    label.htmlFor = 'f-' + field.key;
    wrap.appendChild(label);

    const row = document.createElement('div');
    row.className = 'row';

    const input = document.createElement('input');
    input.type = field.secret ? 'password' : 'text';
    if (field.numeric) input.inputMode = 'numeric';
    input.id = 'f-' + field.key;
    input.placeholder = field.placeholder || '';
    row.appendChild(input);

    // ★★ 这里踩过一个真 bug（用户实测抓到，值得写清楚）：
    //   第一版写的是 `typeof field.generate === 'function'` —— 但字段定义来自
    //   **主进程的 IPC**，函数根本过不了进程边界：主进程发过来的是
    //   `generate: 'HNE_SECRET_KEY'`（字符串）或 `null`。
    //   于是这个条件**永远为假**，"随机生成"按钮从来不会被创建，
    //   而下面的提示文字却一直写着"点右边的「随机生成」" —— 用户照着找，什么也没有。
    //   现在契约是显式布尔量 `generatable`（main.js 算好再发），
    //   并且有一条静态断言把这两个文件绑在一起（desktop/test/setup-ui.test.js）。
    if (field.generatable) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ghost mini';
      btn.textContent = '随机生成';
      btn.addEventListener('click', async () => {
        const value = await api.generate(field.key);
        input.value = value;
        clearError(field.key);
        // 生成之后**顺手把它显示出来**：用户刚点了"随机生成"，第一反应就是
        // "生成了什么？我要不要存进密码管理器？" —— 这时还蒙着圆点很反直觉。
        setVisible(field.key, true);
      });
      row.appendChild(btn);
    }

    // ---- 密码框的「小眼睛」与「复制」----
    // ★ 为什么要有：签名密钥是**随机生成的长串**，用户想核对一眼、或抄进密码管理器，
    //   蒙着圆点什么都看不到（他只能盲信）。所以：
    //   · 👁 切换明文/圆点（**默认仍然隐藏**，不会一开页面就把秘密摊在屏幕上）；
    //   · 复制按钮只给"要生成/抄走"的字段，用 navigator.clipboard（失败就退到 execCommand）。
    // ★ eyeBtn 声明在块外：块级 `const` 出了 `{}` 就没了，
    //   而后面 `inputs[...]` 要用它来同步眼睛状态（第一版写在块内，赋值不到）。
    let eyeBtn = null;
    if (field.secret) {
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'ghost mini eye';
      eye.title = '显示这一格的内容';
      eye.setAttribute('aria-label', '显示这一格的内容');
      eye.setAttribute('aria-pressed', 'false');
      eye.textContent = '👁';
      eye.addEventListener('click', () => {
        // ★ 按**用户视角**判断：当前是隐藏 → 这次点击就是"我要看见"。
        //   第一版按 masked（隐藏）取值，默认就隐藏，于是第一下点下去等于"再隐藏一次"，
        //   表现成"点了没反应" —— 语义反了，排查了很久。
        const live = document.getElementById('f-' + field.key);
        const nowHidden = live ? live.type === 'password' : true;
        setVisible(field.key, nowHidden);
      });
      row.appendChild(eye);
      eyeBtn = eye;

      if (field.generatable) {
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'ghost mini';
        copy.textContent = '复制';
        copy.addEventListener('click', () => {
          void copyText(input.value, copy);
        });
        row.appendChild(copy);
      }
    }

    wrap.appendChild(row);

    if (field.hint) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = field.hint;
      wrap.appendChild(hint);
    }

    const err = document.createElement('div');
    err.className = 'err';
    err.id = 'e-' + field.key;
    wrap.appendChild(err);

    inputs[field.key] = { input, err, eye: eyeBtn };
    container.appendChild(wrap);
  }

  function clearError(key) {
    const item = inputs[key];
    if (!item) return;
    item.err.textContent = '';
    item.input.setAttribute('aria-invalid', 'false');
  }

  function showErrors(errors) {
    for (const key of Object.keys(inputs)) clearError(key);
    for (const [key, message] of Object.entries(errors || {})) {
      const item = inputs[key];
      if (!item) continue;
      item.err.textContent = message;
      item.input.setAttribute('aria-invalid', 'true');
    }
  }

  function collect() {
    const values = {};
    for (const [key, item] of Object.entries(inputs)) values[key] = item.input.value;
    return values;
  }

  async function boot() {
    const info = await api.getFields();
    fieldDefs = info.fields || [];

    for (const field of info.fields) {
      if (field.advanced) buildField(field, el.advancedGrid);
      else if (field.key === 'HNE_SECRET_KEY' || field.key === 'HNE_API_KEY_ENCRYPTION_KEY') buildField(field, el.secretGrid);
      else buildField(field, el.mysqlGrid);
    }

    for (const [key, value] of Object.entries(info.values || {})) {
      if (inputs[key]) inputs[key].input.value = value;
    }

    if (info.existing) {
      el.existingNote.style.display = '';
      el.existingNote.innerHTML = '检测到已有一份配置（<b>只有缺的必填项需要补</b>）：'
        + (info.missing && info.missing.length ? '<code>' + info.missing.join('</code> <code>') + '</code>' : '没有缺项');
    }
    setStatus('', '填好后点「测试连接」——它会真的把后端起起来检查一遍。');
  }

  el.form.addEventListener('submit', async (event) => {
    event.preventDefault();
    // ★ 先本地体检：必填项没填就直接说，**不去起后端**（用户实测撞到的体验问题）
    if (!gateLocal()) return;
    el.save.disabled = true;
    el.test.disabled = true;
    setStatus('busy', '正在保存并启动后端…这可能需要几十秒（首次启动要加载本地嵌入模型）。');
    try {
      const result = await api.save(collect());
      if (result && result.ok) {
        setStatus('ok', result.message || '配置已保存，正在进入控制台…');
      } else {
        showErrors((result && result.errors) || {});
        setStatus('err', (result && result.message) || '没能启动后端。', (result && result.detail) || '');
        el.save.disabled = false;
        el.test.disabled = false;
      }
    } catch (error) {
      setStatus('err', '保存失败：' + (error && error.message ? error.message : error));
      el.save.disabled = false;
      el.test.disabled = false;
    }
  });

  el.test.addEventListener('click', async () => {
    // 同一套本地体检：不通过就别去起后端
    if (!gateLocal()) return;
    el.test.disabled = true;
    el.save.disabled = true;
    setStatus('busy', '正在用这些配置真的起一次后端并检查各组件…（不改动你的配置）');
    try {
      const result = await api.test(collect());
      showErrors((result && result.errors) || {});
      if (result && result.ok) {
        setStatus('ok', result.message || '连接正常：数据库与向量库都可用了。');
      } else {
        setStatus('err', (result && result.message) || '测试没通过。', (result && result.detail) || '');
      }
    } catch (error) {
      setStatus('err', '测试失败：' + (error && error.message ? error.message : error));
    } finally {
      el.test.disabled = false;
      el.save.disabled = false;
    }
  });

  el.openDir.addEventListener('click', () => api.openConfigDir());

  el.logo.addEventListener('error', () => { el.logo.style.visibility = 'hidden'; });

  if (api) boot().catch((error) => setStatus('err', '初始化失败：' + error.message));
</script>
</body>
</html>
