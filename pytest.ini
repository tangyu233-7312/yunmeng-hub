[pytest]
# 测试文件所在目录
testpaths = tests

# 自定义标记说明
# 加了这个段落后，pytest 才不会因为「未注册的标记」发出警告
markers =
    live: 真实大模型 API 测试（必须显式传 --live 并配置 HNE_DEFAULT_LLM_*）
    unit: 独立业务规则与协议适配；不启动应用和数据库
    integration: API、数据库、文件、向量库等组件组合
    acceptance: 隔离子进程的运行环境和启动验证

# 让测试输出里的中文与断言差异更易读
addopts = -ra --strict-markers

# 日志：测试期间不打印 DEBUG 噪音，但保留失败时的关键信息
log_cli = false
log_level = WARNING
